<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدير المقابلات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <header>
        <h1><a class="brand" href="index.html"><img src="logo.png" alt="أَوْج"><span>التوظيف</span></a></h1>
        <nav>
            <a href="index.html">المرشحون</a>
            <a href="schedule.html">المقابلات</a>
            <a href="jobs.html">الوظائف</a>
        </nav>
    </header>

    <main>
        <h2>المرشحون لوظيفة محلل أمن معلومات</h2>
        <p class="subtitle">مرتبون حسب التطابق مع متطلبات الوظيفة</p>

        <section class="stats">
            <div class="stat">
                <span class="stat-num" id="stat-total">0</span>
                <span class="stat-label">إجمالي المرشحين</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="stat-pending">0</span>
                <span class="stat-label">بانتظار الجدولة</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="stat-accepted">0</span>
                <span class="stat-label">مقبولون</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="stat-match">0</span>
                <span class="stat-label">متوسط التطابق</span>
            </div>
        </section>

        <div class="filters">
            <button class="chip active" data-filter="all">الكل</button>
            <button class="chip" data-filter="pending">بانتظار الجدولة</button>
            <button class="chip" data-filter="invited">مدعوّون للمقابلة</button>
            <button class="chip" data-filter="decided">تم القرار</button>
            <a class="btn primary add-link" href="add.html">+ إضافة مرشح</a>
        </div>

        <div class="tools">
            <input type="search" id="search" class="search" placeholder="ابحثي بالاسم" maxlength="60" autocomplete="off" aria-label="بحث بالاسم">
            <label class="sort-label">الترتيب
                <select id="sort" class="sort">
                    <option value="match">الأعلى تطابقاً</option>
                    <option value="years">الأكثر خبرة</option>
                </select>
            </label>
        </div>

        <!-- البطاقات يبنيها script.js هنا -->
        <div class="list" id="candidates-list"></div>
    </main>

    <script src="data.js"></script>
    <script src="schedule-store.js"></script>
    <script src="script.js"></script>
</body>
</html>
